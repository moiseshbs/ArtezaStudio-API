name: CI - ArtezaStudio API # Nome do workflow

on:
  push:
    branches: [ main, develop ] # Branches que disparam o workflow
  pull_request:
    branches: [ main, develop ] # PRs que disparam o workflow

env:
  DOTNET_VERSION: '9.0' # Versão do .NET a ser usada

jobs:
  build: # Job para build
    runs-on: ubuntu-latest # Sistema operacional

    steps:
      - name: Checkout code # Clona o repositório
        uses: actions/checkout@v4

      - name: Setup .NET # Configura o SDK do .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies # Restaura os pacotes NuGet
        run: dotnet restore

      - name: Build solution # Compila a solução
        run: dotnet build --configuration Release --no-restore

  test: # Job para testes
    runs-on: ubuntu-latest
    needs: build # Aguarda o job 'build' ser concluído

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests # Executa testes unitários
        run: dotnet test --configuration Release --no-build --verbosity normal

  format: # Job para validação de formatação
    runs-on: ubuntu-latest
    needs: build # Aguarda o job 'build' ser concluído

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check code formatting # Verifica formatação do código
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true # Não falha o workflow se houver problemas de formatação
