name: CI - ArtezaStudio API # Nome do workflow

on:
  pull_request:
    branches: [ main, develop ] # PRs que disparam o workflow

env:
  DOTNET_VERSION: '9.0' # Versão do .NET a ser usada
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USER }}/artezastudio-api # Imagem publicada no Docker Hub

jobs:
  build: # Job para build
    runs-on: ubuntu-latest # Sistema operacional

    steps:
      - name: Checkout code # Clona o repositório
        uses: actions/checkout@v4

      - name: Setup .NET # Configura o SDK do .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies # Restaura os pacotes NuGet
        run: dotnet restore

      - name: Build solution # Compila a solução
        run: dotnet build --configuration Release --no-restore

  test: # Job para testes
    runs-on: ubuntu-latest
    needs: build # Aguarda o job 'build' ser concluído

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests # Executa testes unitários
        run: dotnet test --configuration Release --verbosity normal

  format: # Job para validação de formatação
    runs-on: ubuntu-latest
    needs: build # Aguarda o job 'build' ser concluído

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check code formatting # Verifica formatação do código
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true # Não falha o workflow se houver problemas de formatação

  docker: # Job para build e publicação da imagem
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.DOCKER_IMAGE_NAME }}:latest
